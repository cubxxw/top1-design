name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m py_compile skills/top1-design/scripts/*.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Exercise scorer
        run: |
          python skills/top1-design/scripts/score_design.py \
            examples/talent-signal-home/evaluation.json > /tmp/score.json || test $? -eq 2
      - name: Exercise release bar
        run: |
          python skills/top1-design/scripts/assess_release.py \
            examples/release-ready/release-manifest.json > /tmp/release.json
      - name: Exercise tournament ranking
        run: |
          python skills/top1-design/scripts/rank_candidates.py \
            examples/talent-signal-home/pairs.jsonl > /tmp/ranking.json
      - name: Exercise product metrics
        run: |
          python skills/top1-design/scripts/assess_product_metrics.py \
            examples/product-validation/cohort.json > /tmp/product-metrics.json
